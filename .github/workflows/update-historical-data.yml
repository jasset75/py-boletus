name: Update historical data

on:
  schedule:
    - cron: '17 12 * * *'
      timezone: Europe/Madrid
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-historical-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Test updater
        run: python -m unittest discover -s tests -v

      - name: Download new draws
        run: python core/update_data.py

      - name: Commit updated history
        run: |
          if git diff --quiet -- data/ES-bonoloto.csv; then
            echo "Historical data is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ES-bonoloto.csv
          git commit -m "data: update Bonoloto history"
          git push
